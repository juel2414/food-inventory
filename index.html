<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>식자재 관리</title>
<meta name="theme-color" content="#3f6b4a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="식자재">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f5f3ee; --card:#fff; --ink:#1f2a22; --muted:#6b7369; --line:#e4e1d8;
  --pri:#3f6b4a; --pri-soft:#e6efe7; --in:#2f6fb3; --in-soft:#e5eef8;
  --out:#c2571f; --out-soft:#fbeee6; --warn:#b42318; --warn-soft:#fdecea; --adj:#7a5cb0; --adj-soft:#f0ebf8;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 16px 8px;display:flex;align-items:center;gap:8px}
header.top h1{font-size:19px;margin:0;flex:1;letter-spacing:-.3px}
.live{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px}
.live i{width:7px;height:7px;border-radius:50%;background:#bbb;display:inline-block}
.live.on i{background:#2fa05a}
main{padding:0 16px calc(90px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--pri);color:#fff;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.5}
.btn.ghost{background:#efede6;color:var(--ink)}
.btn.in{background:var(--in)} .btn.out{background:var(--out)} .btn.warn{background:var(--warn)}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:9px}
.btn.block{width:100%;padding:13px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:12px;background:#efede6;color:var(--ink);white-space:nowrap}
.chip.low{background:var(--warn-soft);color:var(--warn);font-weight:700}
.chip.in{background:var(--in-soft);color:var(--in)} .chip.out{background:var(--out-soft);color:var(--out)} .chip.adjust{background:var(--adj-soft);color:var(--adj)}
.chip.done{background:var(--pri-soft);color:var(--pri);font-weight:700}
input.f,select.f,textarea.f{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-height:42px}
textarea.f{min-height:90px}
label.l{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.search{display:flex;gap:8px;margin:4px 0 10px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .name{font-weight:600}
.qty{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;text-align:right;white-space:nowrap}
.qty.low{color:var(--warn)}
.list{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.cathead{font-size:12px;font-weight:700;color:var(--muted);padding:12px 4px 6px}
.banner{border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:13.5px;display:flex;gap:8px;align-items:center}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--pri-soft);color:var(--pri)}
.week{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.week strong{flex:1;text-align:center}
.day{margin-bottom:14px}
.day h3{font-size:14px;margin:0 0 6px 2px;display:flex;gap:6px;align-items:center}
.day h3.today{color:var(--pri)}
.meal{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:12px;margin-bottom:8px}
.meal.done{background:#f6faf6;border:1px solid #d3e6d6}
.meal .ings{margin-top:6px;font-size:13px;color:var(--muted);line-height:1.6}
.meal .ings b.short{color:var(--warn)}
.slotadd{display:flex;gap:6px;flex-wrap:wrap}
.slotadd button{border:1px dashed #c9c5b8;background:transparent;border-radius:10px;padding:7px 10px;font-size:13px;color:var(--muted)}
.tx{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx.void{opacity:.45}
.tx.void .grow{text-decoration:line-through}
.delta{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.delta.p{color:var(--in)} .delta.m{color:var(--out)}
.ingrow{display:grid;grid-template-columns:1fr 92px 34px;gap:6px;align-items:center;margin-bottom:6px}
.ingrow .x{border:0;background:#efede6;border-radius:8px;height:40px}
.ingwarn{font-size:12px;color:var(--warn);margin:-2px 0 8px}
.sheet-bg{position:fixed;inset:0;background:rgba(20,25,20,.38);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 6px;font-size:18px}
.sheet .acts{display:flex;gap:8px;margin-top:16px}
.sheet .acts .btn{flex:1;padding:13px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:80;max-width:90vw;text-align:center}
.auth{max-width:380px;margin:12vh auto 0;padding:0 16px}
.auth h1{font-size:24px;margin:0 0 4px}
.seg{display:flex;background:#e9e6dd;border-radius:10px;padding:3px;margin:16px 0 4px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.msg{font-size:13px;margin-top:10px;min-height:18px}
.btn.google{background:#fff;color:var(--ink);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:10px}
.divider{display:flex;align-items:center;gap:10px;margin:18px 0 10px;color:var(--muted);font-size:12.5px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}
.msg.err{color:var(--warn)} .msg.ok{color:var(--pri)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat div{background:#fff;border-radius:12px;padding:10px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
table.sum{width:100%;border-collapse:collapse;font-size:13.5px}
table.sum th,table.sum td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
table.sum th:first-child,table.sum td:first-child{text-align:left}
table.sum th{font-size:12px;color:var(--muted);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:25;width:54px;height:54px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:28px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.member{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.member:last-child{border-bottom:0}

.ledger-wrap{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto;margin-bottom:8px}
table.ledger{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;min-width:330px}
table.ledger th{background:#f1efe8;color:var(--muted);font-weight:600;font-size:12px;padding:8px 6px;text-align:right;white-space:nowrap}
table.ledger th:first-child{text-align:left}
table.ledger td{padding:9px 6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
table.ledger td:first-child{text-align:left}
table.ledger td.note{text-align:left;white-space:normal;min-width:90px}
table.ledger tbody tr[onclick]{cursor:pointer}
table.ledger tbody tr[onclick]:active{background:#f6f5f0}
table.ledger tr.sub td{background:#fafaf6;color:var(--muted)}
table.ledger tr.adj td{background:var(--adj-soft)}
table.ledger tfoot td{border-top:2px solid var(--ink);font-weight:700;background:#fafaf6}
.c-in{color:var(--in)} .c-out{color:var(--out)} .c-low{color:var(--warn)}
#printArea{display:none}
@media print{
  @page{size:A4;margin:14mm 12mm}
  body{background:#fff}
  body > *:not(#printArea){display:none !important}
  #printArea{display:block !important;color:#000;font-size:11px}
  .p-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
  .p-head h1{font-size:18px;margin:0 0 4px}
  .p-sub{font-size:10.5px;color:#444}
  .p-sign{border-collapse:collapse}
  .p-sign th,.p-sign td{border:1px solid #000;width:62px;text-align:center;font-size:11px;padding:3px}
  .p-sign td{height:44px}
  .p-item{page-break-inside:avoid;margin-bottom:14px}
  .p-iname{font-weight:700;font-size:13px;margin:6px 0 4px}
  .p-iname span{font-weight:400;font-size:11px;color:#444}
  .p-table{width:100%;border-collapse:collapse}
  .p-table th,.p-table td{border:1px solid #000;padding:3px 5px;text-align:right}
  .p-table th{background:#eee;text-align:center}
  .p-table td.l{text-align:left}
  .p-table td:first-child{text-align:center}
  .p-table tr.tot td{font-weight:700;background:#f3f3f3}
  .p-note{font-size:10px;color:#444}
}
</style>
</head>
<body>

<div id="authView" class="auth hidden">
  <h1>식자재 관리</h1>
  <div class="muted">재고·식단·입출고 기록을 함께 관리해요</div>
  <button class="btn block google" style="margin-top:20px" onclick="signInGoogle()"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Google로 로그인</button>
  <div class="divider"><span>또는 이메일</span></div>
  <div class="seg" style="margin-top:0"><button id="segLogin" class="on" onclick="setAuthMode('login')">로그인</button><button id="segSignup" onclick="setAuthMode('signup')">회원가입</button></div>
  <label class="l">이메일</label><input class="f" id="authEmail" type="email" autocomplete="email">
  <label class="l">비밀번호</label><input class="f" id="authPw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doAuth()">
  <div id="signupName" class="hidden"><label class="l">이름 (기록에 표시돼요)</label><input class="f" id="authName"></div>
  <button class="btn block" style="margin-top:16px" onclick="doAuth()" id="authBtn">로그인</button>
  <div style="text-align:center;margin-top:10px"><button class="btn ghost sm" onclick="resetPw()">비밀번호를 잊었어요</button></div>
  <div class="msg" id="authMsg"></div>
</div>

<div id="pendingView" class="auth hidden">
  <h1>승인 대기 중</h1>
  <p class="muted" id="pendingText">관리자가 승인하면 사용할 수 있어요.</p>
  <label class="l">이름</label><input class="f" id="pendingName">
  <button class="btn block" style="margin-top:12px" onclick="requestJoin()">이름 저장 / 다시 확인</button>
  <button class="btn ghost block" style="margin-top:8px" onclick="signOut()">로그아웃</button>
  <div class="msg" id="pendingMsg"></div>
</div>

<div id="appView" class="hidden">
  <header class="top"><h1 id="title">재고</h1><span class="live" id="live"><i></i>실시간</span></header>
  <main id="main"></main>
  <button class="fab hidden" id="fab">+</button>
  <nav class="tabs">
    <button data-tab="stock" onclick="setTab('stock')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>재고</button>
    <button data-tab="meals" onclick="setTab('meals')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>식단</button>
    <button data-tab="recipes" onclick="setTab('recipes')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 13h16a8 8 0 0 1-16 0z"/><path d="M9 9c0-2 2-2 2-4M13 9c0-2 2-2 2-4"/></svg>레시피</button>
    <button data-tab="history" onclick="setTab('history')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 3h11l3 3v15H5z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>수불부</button>
    <button data-tab="more" onclick="setTab('more')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>설정</button>
  </nav>
</div>

<script>
const SUPABASE_URL = 'https://pvuriqyiyghjuprewkwj.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB2dXJpcXlpeWdoanVwcmV3a3dqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMTE1NzQsImV4cCI6MjA5OTg4NzU3NH0.Rr4YX-OcacHSsgn-dSmuW7pvSGuDouWfPVV1_p8KAb4';
const APP_URL = location.origin + location.pathname;
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'inv-auth' } });

const CATEGORIES = ['채소','과일','육류','수산','곡류·면','양념·소스','유제품·계란','가공식품','냉동','음료','기타'];
const UNITS = ['kg','g','개','봉','팩','모','단','병','캔','L','ml','박스','포'];
const SLOTS = { breakfast:'아침', lunch:'점심', dinner:'저녁', snack:'간식' };
const KIND = { in:'입고', out:'사용', adjust:'실사' };
const WD = ['일','월','화','수','목','금','토'];

const S = {
  user:null, me:null, tab:'stock',
  items:[], allItems:[], recipes:[], recipeItems:[], meals:[], mealItems:[], members:[], expiring:[],
  stockFilter:'all', stockQuery:'',
  weekStart:null,
  hist:{ mode:'summary', from:null, to:null, kind:'', item:'', rows:[], summary:[], ledger:null },
};

// ---------- utils ----------
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => Number(v ?? 0);
const fmt = v => { const n = num(v); return (Math.round(n*1000)/1000).toLocaleString('ko-KR', {maximumFractionDigits:3}); };
const today = () => new Date().toLocaleDateString('sv-SE', { timeZone:'Asia/Seoul' });
const addDays = (d, n) => { const x = new Date(d+'T00:00:00'); x.setDate(x.getDate()+n); return x.toLocaleDateString('sv-SE'); };
const md = d => { const x = new Date(d+'T00:00:00'); return `${x.getMonth()+1}/${x.getDate()}(${WD[x.getDay()]})`; };
const mondayOf = d => { const x = new Date(d+'T00:00:00'); const w = (x.getDay()+6)%7; return addDays(d, -w); };
const itemById = id => S.allItems.find(i => i.id === id);
const isLow = i => num(i.min_quantity) > 0 && num(i.quantity) <= num(i.min_quantity);
const isAdmin = () => S.me?.role === 'admin';
const memberName = uid => S.members.find(m => m.user_id === uid)?.name || '';
function toast(t, ms=2200){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(), ms); }
function errMsg(e){ return (e?.message || String(e)).replace(/^.*?:\s*/, m => m.includes('P0001') ? '' : m); }
async function run(promise, okText){
  const { data, error } = await promise;
  if (error) { toast('오류: ' + (error.message || error)); throw error; }
  if (okText) toast(okText);
  return data;
}

// ---------- sheet ----------
function openSheet(html){
  closeSheet();
  const bg = document.createElement('div');
  bg.className = 'sheet-bg'; bg.id = 'sheetBg';
  bg.innerHTML = `<div class="sheet" id="sheet">${html}</div>`;
  bg.addEventListener('click', e => { if (e.target === bg) closeSheet(); });
  document.body.appendChild(bg);
  return $('sheet');
}
function closeSheet(){ $('sheetBg')?.remove(); }

// ---------- auth ----------
let authMode = 'login';
function setAuthMode(m){
  authMode = m;
  $('segLogin').classList.toggle('on', m==='login'); $('segSignup').classList.toggle('on', m==='signup');
  $('signupName').classList.toggle('hidden', m!=='signup');
  $('authBtn').textContent = m==='login' ? '로그인' : '가입하기';
  $('authPw').autocomplete = m==='login' ? 'current-password' : 'new-password';
  $('authMsg').textContent = '';
}
async function doAuth(){
  const email = $('authEmail').value.trim(), pw = $('authPw').value, msg = $('authMsg');
  if (!email || !pw) { msg.textContent='이메일과 비밀번호를 입력해주세요.'; msg.className='msg err'; return; }
  msg.textContent='처리 중...'; msg.className='msg';
  if (authMode === 'login') {
    const { error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) { msg.textContent = error.message==='Invalid login credentials' ? '이메일 또는 비밀번호가 맞지 않아요. 구글로 가입한 계정이면 위의 "Google로 로그인"을 눌러주세요.' : error.message; msg.className='msg err'; }
  } else {
    const name = $('authName').value.trim();
    if (!name) { msg.textContent='이름을 입력해주세요.'; msg.className='msg err'; return; }
    if (pw.length < 6) { msg.textContent='비밀번호는 6자 이상이어야 해요.'; msg.className='msg err'; return; }
    localStorage.setItem('inv-pending-name', name);
    const { data, error } = await sb.auth.signUp({ email, password: pw });
    if (error) { msg.textContent = error.message; msg.className='msg err'; return; }
    if (!data?.session) {
      if (!data?.user?.identities?.length) { msg.textContent='이미 가입된 이메일이에요. 다른 앱에서 쓰던 계정이면 로그인 탭에서 그대로 로그인하세요.'; msg.className='msg err'; return; }
      const { error: e2 } = await sb.auth.signInWithPassword({ email, password: pw });
      if (e2) { msg.textContent='가입 완료! 로그인해주세요.'; msg.className='msg ok'; setAuthMode('login'); }
    }
  }
}
async function resetPw(){
  const email = $('authEmail').value.trim(), msg = $('authMsg');
  if (!email) { msg.textContent='이메일을 먼저 입력해주세요.'; msg.className='msg err'; return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: APP_URL });
  msg.textContent = error ? error.message : '비밀번호 재설정 링크를 이메일로 보냈어요.'; msg.className = error ? 'msg err' : 'msg ok';
}
async function signInGoogle(){
  await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: APP_URL } });
}
async function signOut(){ await sb.auth.signOut(); location.reload(); }

function show(view){ ['authView','pendingView','appView'].forEach(v => $(v).classList.toggle('hidden', v!==view)); }

async function requestJoin(){
  const name = ($('pendingName')?.value || localStorage.getItem('inv-pending-name') || '').trim();
  const { data: role, error } = await sb.rpc('inv_join', { p_name: name });
  if (error) { $('pendingMsg').textContent = error.message; $('pendingMsg').className='msg err'; return; }
  localStorage.removeItem('inv-pending-name');
  await enter(role);
}

async function enter(role){
  const { data: me } = await sb.from('inv_members').select('*').eq('user_id', S.user.id).maybeSingle();
  S.me = me;
  if (!me) { await requestJoin(); return; }
  if (me.role === 'pending') {
    show('pendingView');
    $('pendingName').value = me.name || '';
    $('pendingText').textContent = `${S.user.email} 계정으로 가입 요청을 보냈어요. 관리자가 승인하면 사용할 수 있어요.`;
    if (role) { $('pendingMsg').textContent = '확인했어요. 아직 승인 대기 중이에요.'; $('pendingMsg').className='msg'; }
    return;
  }
  show('appView');
  S.weekStart = mondayOf(today());
  S.hist.from = today().slice(0,8) + '01'; S.hist.to = lastDay(today());
  await Promise.all([loadCore(), loadMeals()]);
  subscribe();
  setTab(S.tab);
}

let booted = false;
sb.auth.onAuthStateChange(async (event, session) => {
  if (event === 'PASSWORD_RECOVERY') {
    setTimeout(async () => {
      const pw = prompt('새 비밀번호를 입력하세요 (6자 이상)');
      if (pw) { const { error } = await sb.auth.updateUser({ password: pw }); toast(error ? error.message : '비밀번호를 변경했어요.'); }
    }, 300);
  }
  if (session?.user) {
    if (booted && S.user?.id === session.user.id) return;
    booted = true; S.user = session.user;
    await enter();
  } else { booted = false; S.user = null; show('authView'); }
});

// ---------- data ----------
async function loadCore(){
  const soon = addDays(today(), 7);
  const [items, recipes, recipeItems, members, exp] = await Promise.all([
    sb.from('inv_items').select('*').order('category').order('name'),
    sb.from('inv_recipes').select('*').order('name'),
    sb.from('inv_recipe_items').select('*'),
    sb.from('inv_members').select('*').order('created_at'),
    sb.from('inv_transactions').select('item_id,expiry_date,delta,occurred_on').eq('kind','in').is('voided_at', null)
      .not('expiry_date','is',null).lte('expiry_date', soon).gte('expiry_date', addDays(today(), -3)).order('expiry_date'),
  ]);
  S.allItems = items.data || []; S.items = S.allItems.filter(i => i.is_active); S.recipes = recipes.data || []; S.recipeItems = recipeItems.data || [];
  S.members = members.data || []; S.expiring = (exp.data || []).filter(e => { const i = itemById(e.item_id); return i?.is_active && num(i.quantity) > 0; });
  const me = S.members.find(m => m.user_id === S.user.id); if (me) S.me = me;
}
async function loadMeals(){
  const from = S.weekStart, to = addDays(S.weekStart, 6);
  const { data: meals } = await sb.from('inv_meals').select('*').gte('meal_date', from).lte('meal_date', to).order('meal_date');
  S.meals = meals || [];
  const ids = S.meals.map(m => m.id);
  if (ids.length) { const { data } = await sb.from('inv_meal_items').select('*').in('meal_id', ids); S.mealItems = data || []; }
  else S.mealItems = [];
}

let rtTimer = null, channel = null;
function subscribe(){
  if (channel) return;
  channel = sb.channel('inv-live');
  ['inv_items','inv_transactions','inv_meals','inv_meal_items','inv_recipes','inv_recipe_items','inv_members'].forEach(t =>
    channel.on('postgres_changes', { event:'*', schema:'public', table:t }, () => {
      clearTimeout(rtTimer);
      rtTimer = setTimeout(async () => { await Promise.all([loadCore(), loadMeals()]); if ($('sheetBg')) S.dirty = true; else if (S.tab === 'history') loadHistory(); else render(); }, 350);
    }));
  channel.subscribe(st => $('live').classList.toggle('on', st === 'SUBSCRIBED'));
}
async function refresh(){ await Promise.all([loadCore(), loadMeals()]); if (S.tab === 'history') await loadHistory(); else render(); }

// ---------- tabs ----------
function setTab(t){
  S.tab = t;
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  $('title').textContent = { stock:'재고', meals:'식단표', recipes:'레시피', history:'재고 수불부', more:'설정' }[t];
  window.scrollTo(0,0);
  if (t === 'history') loadHistory(); else render();
}
function render(){
  S.dirty = false;
  const fab = $('fab'); fab.classList.add('hidden'); fab.onclick = null;
  ({ stock:renderStock, meals:renderMeals, recipes:renderRecipes, history:renderHistory, more:renderMore })[S.tab]();
}
function setFab(fn){ const f=$('fab'); f.classList.remove('hidden'); f.onclick=fn; }

// ---------- 재고 ----------
function renderStock(){
  const q = S.stockQuery.trim();
  const low = S.items.filter(isLow);
  let list = S.items;
  if (S.stockFilter === 'low') list = low;
  else if (S.stockFilter !== 'all') list = list.filter(i => i.category === S.stockFilter);
  if (q) list = list.filter(i => (i.name + i.location + i.memo).includes(q));
  const cats = [...new Set(S.items.map(i => i.category))];
  const groups = {};
  list.forEach(i => (groups[i.category] ||= []).push(i));

  let html = '';
  if (low.length) html += `<div class="banner warn" onclick="S.stockFilter='low';renderStock()"><b>부족 ${low.length}개</b><span class="grow">${esc(low.slice(0,4).map(i=>i.name).join(', '))}${low.length>4?' 외':''}</span><span>보기 ›</span></div>`;
  if (S.expiring.length) {
    const names = [...new Map(S.expiring.map(e => [e.item_id, e])).values()].map(e => `${esc(itemById(e.item_id)?.name||'')}(${md(e.expiry_date)})`);
    html += `<div class="banner info"><b>유통기한 임박</b><span class="grow">${names.slice(0,4).join(', ')}${names.length>4?' 외':''}</span></div>`;
  }
  html += `<div class="search"><input class="f" placeholder="품목 검색" value="${esc(q)}" oninput="S.stockQuery=this.value;renderStockList()" id="stockQ"></div>
  <div class="filters">
    <button class="${S.stockFilter==='all'?'on':''}" onclick="S.stockFilter='all';renderStock()">전체 ${S.items.length}</button>
    <button class="${S.stockFilter==='low'?'on':''}" onclick="S.stockFilter='low';renderStock()">부족 ${low.length}</button>
    ${cats.map(c => `<button class="${S.stockFilter===c?'on':''}" onclick="S.stockFilter='${esc(c)}';renderStock()">${esc(c)}</button>`).join('')}
  </div><div id="stockList"></div>`;
  if (S.stockFilter === 'low' && low.length) html += `<button class="btn ghost block" onclick="copyShopping()">장보기 목록 복사</button>`;
  $('main').innerHTML = html;
  renderStockList();
  setFab(() => itemEditor());
  pushNudge().then(h => { if (h && S.tab === 'stock' && !$('main').querySelector('.nudge')) $('main').insertAdjacentHTML('afterbegin', h.replace('class="banner info"', 'class="banner info nudge"')); });
}
function renderStockList(){
  const q = S.stockQuery.trim();
  let list = S.items;
  if (S.stockFilter === 'low') list = list.filter(isLow);
  else if (S.stockFilter !== 'all') list = list.filter(i => i.category === S.stockFilter);
  if (q) list = list.filter(i => (i.name + i.location + i.memo).includes(q));
  const groups = {}; list.forEach(i => (groups[i.category] ||= []).push(i));
  const el = $('stockList'); if (!el) return;
  if (!S.items.length) { el.innerHTML = `<div class="empty">아직 등록된 품목이 없어요.<br>오른쪽 아래 + 버튼으로 추가하거나<br>설정 › 품목 일괄 등록을 이용하세요.</div>`; return; }
  if (!list.length) { el.innerHTML = `<div class="empty">해당하는 품목이 없어요.</div>`; return; }

}
function copyShopping(){
  const t = S.items.filter(isLow).map(i => `- ${i.name}: 현재 ${fmt(i.quantity)}${i.unit} (최소 ${fmt(i.min_quantity)}${i.unit})`).join('\n');

async function saveItem(id){
  const row = { name:$('ie_name').value.trim(), category:$('ie_cat').value.trim()||'기타', unit:$('ie_unit').value.trim()||'개',
    min_quantity:num($('ie_min').value), location:$('ie_loc').value.trim(), memo:$('ie_memo').value.trim() };
  if (!row.name) return toast('품목명을 입력해주세요');
  if (id) { await run(sb.from('inv_items').update(row).eq('id', id), '저장했어요'); }
  else {
    if (S.items.some(x => x.name === row.name)) { if (!confirm(`'${row.name}' 품목이 이미 있어요. 그래도 추가할까요?`)) return; }
    const it = await run(sb.from('inv_items').insert(row).select().single());
    const q = num($('ie_qty').value);
    if (q > 0) await run(sb.rpc('inv_record', { p_item: it.id, p_kind:'adjust', p_quantity:q, p_memo:'초기 재고' }));
    toast('추가했어요');
  }
  closeSheet(); await refresh();
}
async function archiveItem(id){
  const i = itemById(id);
  if (!confirm(`'${i.name}' 품목을 목록에서 삭제할까요?\n기존 입출고 기록은 그대로 남아요.`)) return;
  await run(sb.from('inv_items').update({ is_active:false }).eq('id', id), '삭제했어요');
  closeSheet(); await refresh();
}

function txForm(id, kind){

  openSheet(`
    <h2>${esc(i.name)} ${KIND[kind]}</h2>
    <div class="muted small">현재 재고 ${fmt(i.quantity)}${esc(i.unit)}</div>

    ${kind==='in' ? `<div class="grid2">
      <div><label class="l">유통기한 (선택)</label><input class="f" id="tx_exp" type="date"></div>
      <div><label class="l">금액 (선택, 원)</label><input class="f" id="tx_price" type="number" inputmode="numeric"></div></div>
      <label class="l">구매처 / 후원처 (선택)</label><input class="f" id="tx_vendor">` : ''}
    <label class="l">메모 (선택)</label><input class="f" id="tx_memo">
    <div class="acts"><button class="btn ghost" onclick="closeSheet()">취소</button><button class="btn ${color}" id="tx_ok" onclick="submitTx('${id}','${kind}')">${KIND[kind]} 기록</button></div>`);
  setTimeout(() => $('tx_q').focus(), 100);

async function submitTx(id, kind){
  const q = $('tx_q').value;
  if (q === '' || num(q) < 0 || (kind !== 'adjust' && num(q) === 0)) return toast('수량을 입력해주세요');
  const i = itemById(id);
  if (kind === 'out' && num(q) > num(i.quantity) && !confirm(`현재 재고(${fmt(i.quantity)}${i.unit})보다 많아요. 그래도 기록할까요?`)) return;
  $('tx_ok').disabled = true;
  try {
    await run(sb.rpc('inv_record', { p_item:id, p_kind:kind, p_quantity:num(q), p_date:$('tx_d').value || null,
      p_expiry:$('tx_exp')?.value || null, p_vendor:$('tx_vendor')?.value.trim() || '', p_price:$('tx_price')?.value ? num($('tx_price').value) : null,
      p_memo:$('tx_memo').value.trim() }), `${i.name} ${KIND[kind]} 기록했어요`);
    closeSheet(); await refresh();
  } catch { $('tx_ok').disabled = false; }
}

function txRow(t, i, showItem){
  i ||= itemById(t.item_id) || { name:'(삭제된 품목)', unit:'' };
  const d = num(t.delta), meal = t.meal_id ? '식단' : '';

  const extra = [t.vendor && `구매처 ${esc(t.vendor)}`, t.price && `${num(t.price).toLocaleString()}원`, t.expiry_date && `유통기한 ${t.expiry_date}`, t.memo && esc(t.memo)].filter(Boolean).join(' · ');
  return `<div class="tx ${t.voided_at?'void':''}">
    <span class="chip ${t.kind}">${KIND[t.kind]}${meal?'·'+meal:''}</span>
    <div class="grow">
      <div>${showItem ? `<b>${esc(i.name)}</b> · ` : ''}${md(t.occurred_on)} <span class="small muted">${esc(t.user_name||'')}</span></div>
      ${extra ? `<div class="small muted">${extra}</div>` : ''}
      ${t.voided_at ? `<div class="small" style="color:var(--warn);text-decoration:none">취소됨</div>` : ''}
    </div>
    <div style="text-align:right">
      <div class="delta ${d>=0?'p':'m'}">${d>=0?'+':''}${fmt(d)}${esc(i.unit)}</div>
      <div class="small muted">잔량 ${fmt(t.balance_after)}</div>
      ${canVoid ? `<button class="btn ghost sm" style="margin-top:4px" onclick="voidTx('${t.id}','${t.item_id}')">취소</button>` : ''}
    </div></div>`;
}
async function voidTx(txId, itemId){
  if (!confirm('이 기록을 취소할까요? 재고가 기록 전으로 되돌아가요.')) return;
  await run(sb.rpc('inv_void', { p_tx: txId }), '기록을 취소했어요');
  await refresh();
  if (S.tab !== 'history') itemDetail(itemId);
}

// ---------- 식단 ----------
function mealNeeds(mealId){ return S.mealItems.filter(x => x.meal_id === mealId); }
function plannedDemand(excludeMeal){
  // 오늘 이후 '예정' 식단들이 필요로 하는 양 (불러온 주 기준)
  const map = {};
  S.meals.filter(m => m.status==='planned' && m.id!==excludeMeal).forEach(m =>
    mealNeeds(m.id).forEach(x => map[x.item_id] = (map[x.item_id]||0) + num(x.quantity)));
  return map;
}
function renderMeals(){
  const days = [...Array(7)].map((_, k) => addDays(S.weekStart, k));
  const t = today();
  const end = addDays(S.weekStart, 6);
  let html = `<div class="week">
    <button class="btn ghost sm" onclick="shiftWeek(-7)">‹ 이전</button>
    <strong>${md(S.weekStart)} ~ ${md(end)}</strong>
    <button class="btn ghost sm" onclick="shiftWeek(7)">다음 ›</button></div>
    ${!days.includes(t) ? `<div style="text-align:center;margin-bottom:10px"><button class="btn ghost sm" onclick="S.weekStart=mondayOf(today());loadMeals().then(render)">이번 주로</button></div>` : ''}`;
  days.forEach(d => {
    const ms = S.meals.filter(m => m.meal_date === d).sort((a,b) => Object.keys(SLOTS).indexOf(a.slot) - Object.keys(SLOTS).indexOf(b.slot));
    html += `<div class="day"><h3 class="${d===t?'today':''}">${md(d)} ${d===t?'<span class="chip done">오늘</span>':''}</h3>

  });
  $('main').innerHTML = html;
}
function mealCard(m){

async function shiftWeek(n){ S.weekStart = addDays(S.weekStart, n); await loadMeals(); render(); }

function itemSelect(sel){
  const groups = {}; S.items.forEach(i => (groups[i.category] ||= []).push(i));
  return `<option value="">품목 선택</option>` + Object.entries(groups).map(([c, arr]) =>
    `<optgroup label="${esc(c)}">${arr.map(i => `<option value="${i.id}" ${i.id===sel?'selected':''}>${esc(i.name)} (${fmt(i.quantity)}${esc(i.unit)})</option>`).join('')}</optgroup>`).join('');
}
function ingRowHtml(itemId, qty){
  const u = itemById(itemId)?.unit || '';
  return `<div class="ingrow"><select class="f ing-item" onchange="ingChanged()">${itemSelect(itemId)}</select>
    <input class="f ing-qty" type="number" inputmode="decimal" step="any" placeholder="${esc(u)||'수량'}" value="${qty ?? ''}" oninput="ingChanged()">
    <button class="x" onclick="this.parentElement.remove();ingChanged()">✕</button></div>`;
}
function addIngRow(itemId, qty){ $('ings').insertAdjacentHTML('beforeend', ingRowHtml(itemId, qty)); ingChanged(); }
function readIngs(){
  const rows = [...document.querySelectorAll('#ings .ingrow')].map(r => ({ item_id:r.querySelector('.ing-item').value, quantity:num(r.querySelector('.ing-qty').value) }));
  const merged = {};
  rows.filter(r => r.item_id && r.quantity > 0).forEach(r => merged[r.item_id] = (merged[r.item_id]||0) + r.quantity);
  return Object.entries(merged).map(([item_id, quantity]) => ({ item_id, quantity }));
}
function ingChanged(){
  const box = $('ingWarn'); if (!box) return;
  const ctx = box.dataset.ctx;
  document.querySelectorAll('#ings .ingrow').forEach(r => { const i = itemById(r.querySelector('.ing-item').value); r.querySelector('.ing-qty').placeholder = i?.unit || '수량'; });
  if (ctx !== 'meal') { box.innerHTML = ''; return; }
  const other = plannedDemand(box.dataset.meal);
  const warns = readIngs().map(r => {
    const i = itemById(r.item_id);
    if (r.quantity > num(i.quantity)) return `${esc(i.name)}: 필요 ${fmt(r.quantity)} / 재고 ${fmt(i.quantity)}${esc(i.unit)}`;
    if (r.quantity + (other[r.item_id]||0) > num(i.quantity)) return `${esc(i.name)}: 이번 주 다른 식단까지 합치면 ${fmt(r.quantity + other[r.item_id])}${esc(i.unit)} 필요 (재고 ${fmt(i.quantity)})`;
    return '';
  }).filter(Boolean);
  box.innerHTML = warns.length ? '⚠ 재고 부족<br>' + warns.join('<br>') : '';
}
function recipePicker(){

async function saveMeal(id, completeAfter){
  const row = { meal_date:$('m_date').value, slot:$('m_slot').value, title:$('m_title').value.trim(), memo:$('m_memo').value.trim() };
  if (!row.meal_date) return toast('날짜를 선택해주세요');
  const ings = readIngs();
  let mid = id;
  if (id) await run(sb.from('inv_meals').update(row).eq('id', id));
  else mid = (await run(sb.from('inv_meals').insert(row).select().single())).id;
  await run(sb.from('inv_meal_items').delete().eq('meal_id', mid));
  if (ings.length) await run(sb.from('inv_meal_items').insert(ings.map(x => ({ ...x, meal_id:mid }))));
  closeSheet();
  await refresh();
  if (completeAfter) await completeMeal(mid); else toast('저장했어요');
}

  if (!confirm(`${md(m.meal_date)} ${SLOTS[m.slot]} ${m.title||''}\n아래 재료를 재고에서 차감할까요?\n\n${lines}`)) return;

}

const LMODES = { summary:'수불 현황', ledger:'품목별 수불부', list:'전체 기록' };
function periodLabel(){
  const { from, to } = S.hist;
  if (from.slice(8) === '01' && to === lastDay(from)) return `${from.slice(0,4)}년 ${num(from.slice(5,7))}월`;
  return `${from} ~ ${to}`;
}
function lastDay(d){ const x = new Date(d.slice(0,8) + '01T00:00:00'); x.setMonth(x.getMonth()+1); x.setDate(0); return x.toLocaleDateString('sv-SE'); }
function setMonth(ym){ if (!ym) return; S.hist.from = ym + '-01'; S.hist.to = lastDay(S.hist.from); loadHistory(); }
function histPreset(p){
  const t = today();
  if (p === 'month') { S.hist.from = t.slice(0,8)+'01'; S.hist.to = lastDay(t); }
  if (p === 'last') { const d = new Date(t.slice(0,8)+'01T00:00:00'); d.setDate(0); const e = d.toLocaleDateString('sv-SE'); S.hist.from = e.slice(0,8)+'01'; S.hist.to = e; }
  if (p === 'week') { S.hist.from = mondayOf(t); S.hist.to = addDays(S.hist.from, 6); }
  if (p === 'year') { S.hist.from = t.slice(0,4)+'-01-01'; S.hist.to = t.slice(0,4)+'-12-31'; }
  loadHistory();
}
function openLedger(itemId){ S.hist.mode = 'ledger'; S.hist.item = itemId; loadHistory(); window.scrollTo(0,0); }

async function loadHistory(){
  const h = S.hist;
  if (h.mode === 'summary') {
    const { data, error } = await sb.rpc('inv_ledger_summary', { p_from:h.from, p_to:h.to });
    if (error) toast('불러오지 못했어요: ' + error.message);
    h.summary = data || [];
  } else if (h.mode === 'ledger') {
    if (!h.item || !itemById(h.item)) h.item = S.items[0]?.id || '';
    if (h.item) {
      const [op, rows] = await Promise.all([
        sb.rpc('inv_item_opening', { p_item:h.item, p_from:h.from }),
        sb.from('inv_transactions').select('*').eq('item_id', h.item).is('voided_at', null)
          .gte('occurred_on', h.from).lte('occurred_on', h.to).order('occurred_on').order('created_at'),
      ]);
      h.ledger = { opening:num(op.data), rows:rows.data || [] };
    } else h.ledger = { opening:0, rows:[] };
  } else {
    let q = sb.from('inv_transactions').select('*').gte('occurred_on', h.from).lte('occurred_on', h.to)
      .order('occurred_on', { ascending:false }).order('created_at', { ascending:false }).limit(2000);
    if (h.kind) q = q.eq('kind', h.kind);
    if (h.item) q = q.eq('item_id', h.item);
    const { data, error } = await q;
    if (error) toast('기록을 불러오지 못했어요: ' + error.message);
    h.rows = data || [];
  }
  if (S.tab === 'history') render();
}

// 수불 현황: 모든 품목(기록 없는 품목은 0) + 삭제됐지만 기간 내 기록이 있는 품목
function summaryRows(){
  const by = Object.fromEntries((S.hist.summary || []).map(r => [r.item_id, r]));
  const ids = new Set([...S.items.map(i => i.id), ...Object.keys(by)]);
  return [...ids].map(id => {
    const i = itemById(id) || { id, name:'(삭제된 품목)', unit:'', category:'기타' };
    const r = by[id] || {};
    return { item:i, opening:num(r.opening), in:num(r.in_qty), out:num(r.out_qty), adj:num(r.adj_qty), closing:num(r.closing), amount:num(r.in_amount) };
  }).filter(r => r.item.is_active !== false || r.opening || r.in || r.out || r.adj || r.closing)
    .sort((a,b) => a.item.category.localeCompare(b.item.category, 'ko') || a.item.name.localeCompare(b.item.name, 'ko'));
}
// 품목별 수불부: 날짜순 행 + 잔량 누계
function ledgerRows(){
  const { opening, rows } = S.hist.ledger || { opening:0, rows:[] };
  let bal = opening;
  return rows.map(t => {
    const d = num(t.delta); bal += d;
    let note;
    if (t.kind === 'in') note = ['입고', t.vendor, t.memo].filter(Boolean).join(' · ');
    else if (t.kind === 'out') note = t.meal_id ? `식단 · ${t.memo || ''}` : ['사용', t.memo].filter(Boolean).join(' · ');
    else note = t.memo === '초기 재고' ? '초기 재고' : ['재고조사 조정', t.memo].filter(Boolean).join(' · ');
    return { t, date:t.occurred_on, note, inQ: d > 0 ? d : 0, outQ: d < 0 ? -d : 0, adj: t.kind === 'adjust', bal, who:t.user_name, price:t.price, expiry:t.expiry_date };
  });
}
const cellQ = v => v ? fmt(v) : '';

function renderHistory(){
  const h = S.hist;
  const [ym] = [h.from.slice(0,7)];
  let html = `
    <div class="seg" style="margin-top:4px">${Object.entries(LMODES).map(([k,v]) => `<button class="${h.mode===k?'on':''}" onclick="S.hist.mode='${k}';loadHistory()">${v}</button>`).join('')}</div>
    <div class="filters" style="margin-top:8px">
      <button onclick="histPreset('month')">이번 달</button><button onclick="histPreset('last')">지난 달</button>
      <button onclick="histPreset('week')">이번 주</button><button onclick="histPreset('year')">올해</button>
    </div>
    <div class="row" style="gap:8px"><span class="small muted" style="width:52px">월 선택</span><input class="f grow" type="month" value="${ym}" onchange="setMonth(this.value)"></div>
    <div class="row" style="gap:6px;margin-top:6px"><span class="small muted" style="width:52px">기간</span>
      <input class="f" type="date" value="${h.from}" onchange="S.hist.from=this.value;loadHistory()" style="flex:1;min-width:0;padding:8px 6px">
      <span class="muted">~</span>
      <input class="f" type="date" value="${h.to}" onchange="S.hist.to=this.value;loadHistory()" style="flex:1;min-width:0;padding:8px 6px"></div>`;
  if (h.mode === 'summary') html += renderSummary();
  else if (h.mode === 'ledger') html += renderLedger();
  else html += renderTxList();
  $('main').innerHTML = html;
}

function renderSummary(){
  const rows = summaryRows();
  const tot = rows.reduce((a,r) => (a.in += r.in ? 1 : 0, a.out += r.out ? 1 : 0, a.amount += r.amount, a), { in:0, out:0, amount:0 });
  const low = rows.filter(r => num(r.item.min_quantity) > 0 && r.closing <= num(r.item.min_quantity)).length;
  return `
    <div class="stat" style="margin-top:12px">
      <div><b>${tot.in}</b><span>입고 품목</span></div><div><b>${tot.out}</b><span>출고 품목</span></div><div><b>${tot.amount ? tot.amount.toLocaleString() : '-'}</b><span>입고 금액(원)</span></div>
    </div>

function downloadCsv(name, head, lines){
  const cell = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  const blob = new Blob(['﻿' + [head, ...lines].map(r => r.map(cell).join(',')).join('\n')], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}
function exportCsv(){
  downloadCsv(`식자재기록_${S.hist.from}_${S.hist.to}.csv`,

// ---------- 푸시 알림 ----------
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
async function currentSub(){ if (!pushSupported()) return null; const reg = await navigator.serviceWorker.ready; return reg.pushManager.getSubscription(); }
async function renderPush(){
  const el = $('pushBody'); if (!el) return;
  if (!pushSupported()) {
    el.innerHTML = isIOS && !isStandalone
      ? '아이폰은 먼저 <b>홈 화면에 추가</b>로 앱을 설치한 뒤, 설치된 앱에서 알림을 켤 수 있어요. (iOS 16.4 이상)'
      : '이 브라우저는 알림을 지원하지 않아요. Chrome이나 Safari(홈 화면 앱)를 이용해주세요.';
    return;
  }
  if (Notification.permission === 'denied') { el.innerHTML = '알림이 차단돼 있어요. 휴대폰 설정 › 알림에서 이 앱의 알림을 허용해주세요.'; return; }
  const sub = await currentSub();
  const on = !!sub && Notification.permission === 'granted';
  el.innerHTML = `<p style="margin:0 0 10px">${on ? '이 기기로 알림을 받고 있어요. 다른 사람이 입고·사용하거나 식단을 사용 완료하면 알려 드려요.' : '켜 두면 다른 사람이 재고를 바꿀 때마다 이 기기로 알림이 와요.'}</p>
    <div class="row">${on
      ? `<button class="btn ghost grow" onclick="pushOff()">알림 끄기</button><button class="btn grow" onclick="pushTest()">시험 알림</button>`
      : `<button class="btn block" onclick="pushOn()">이 기기에서 알림 켜기</button>`}</div>`;
}
async function pushOn(){
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { toast('알림이 허용되지 않았어요'); return renderPush(); }
    const { data: key, error } = await sb.rpc('inv_vapid_public');
    if (error || !key) throw new Error(error?.message || '서버 키를 받지 못했어요');
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      const raw = Uint8Array.from(atob(key.replace(/-/g,'+').replace(/_/g,'/') + '==='.slice((key.length+3)%4)), c => c.charCodeAt(0));
      sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:raw });
    }
    const j = sub.toJSON();
    await run(sb.rpc('inv_push_subscribe', { p_endpoint:j.endpoint, p_p256dh:j.keys.p256dh, p_auth:j.keys.auth, p_ua:navigator.userAgent }), '알림을 켰어요');
    localStorage.setItem('inv-push-asked', '1');
  } catch (e) { toast('알림 켜기 실패: ' + (e.message || e)); }
  renderPush(); if (S.tab === 'stock') renderStock();
}
async function pushOff(){
  const sub = await currentSub();
  if (sub) { await sb.rpc('inv_push_unsubscribe', { p_endpoint: sub.endpoint }); await sub.unsubscribe(); }
  toast('이 기기 알림을 껐어요'); renderPush();
}
async function pushTest(){
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch(`${SUPABASE_URL}/functions/v1/inv-push`, { method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+session.access_token }, body:JSON.stringify({ action:'test' }) });
  const r = await res.json().catch(() => ({}));
  toast(r.sent ? '시험 알림을 보냈어요' : '보내지 못했어요: ' + (r.error || res.status));
}
async function pushNudge(){
  // 재고 탭 상단: 아직 알림을 안 켠 기기에 한 번 안내
  if (localStorage.getItem('inv-push-asked')) return '';
  if (!pushSupported()) return isIOS && !isStandalone ? `<div class="banner info"><span class="grow">📲 홈 화면에 추가하면 앱처럼 쓰고 변경 알림도 받을 수 있어요</span><button class="btn ghost sm" onclick="localStorage.setItem('inv-push-asked','1');this.parentElement.remove()">닫기</button></div>` : '';
  if (Notification.permission !== 'default' && await currentSub()) return '';
  if (Notification.permission === 'denied') return '';
  return `<div class="banner info"><span class="grow">🔔 재고가 바뀔 때 알림을 받을까요?</span><button class="btn sm" onclick="pushOn()">켜기</button><button class="btn ghost sm" onclick="localStorage.setItem('inv-push-asked','1');this.parentElement.remove()">나중에</button></div>`;
}

async function setRole(uid, role){
  if (role === '__del') {
    if (!confirm('이 멤버를 내보낼까요? (계정은 삭제되지 않고 식자재 앱 접근만 해제돼요)')) return render();
    await run(sb.from('inv_members').delete().eq('user_id', uid), '내보냈어요');
  } else await run(sb.from('inv_members').update({ role }).eq('user_id', uid), '변경했어요');
  await refresh();
}
async function bulkImport(){
  const lines = $('bulk').value.split('\n').map(l => l.trim()).filter(Boolean);
  if (!lines.length) return toast('내용을 붙여넣어 주세요');
  const parsed = lines.map(l => { const c = l.split(/\t|,/).map(s => s.trim()); return { name:c[0], category:c[1]||'기타', unit:c[2]||'개', qty:num(c[3]), min_quantity:num(c[4]), location:c[5]||'' }; })
    .filter(p => p.name && !/^품목/.test(p.name));
  const existing = new Set(S.items.map(i => i.name));
  const fresh = parsed.filter(p => !existing.has(p.name)), skipped = parsed.length - fresh.length;
  if (!fresh.length) return toast('새로 추가할 품목이 없어요 (이미 모두 있음)');
  if (!confirm(`${fresh.length}개 품목을 등록할까요?${skipped ? `\n(이미 있는 ${skipped}개는 건너뜀)` : ''}`)) return;
  const ins = await run(sb.from('inv_items').insert(fresh.map(({ qty, ...r }) => r)).select());
  for (const it of ins) { const p = fresh.find(f => f.name === it.name); if (p?.qty > 0) await sb.rpc('inv_record', { p_item:it.id, p_kind:'adjust', p_quantity:p.qty, p_memo:'초기 재고' }); }
  $('bulk').value = ''; toast(`${ins.length}개 품목을 등록했어요`); await refresh();
}

document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me && S.me.role !== 'pending') refresh(); });
const _close = closeSheet; closeSheet = function(){ _close(); if (S.dirty) { if (S.tab === 'history') loadHistory(); else render(); } };
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
